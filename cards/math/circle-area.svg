<svg xmlns="http://www.w3.org/2000/svg" width="320" height="280" viewBox="0 0 320 280" role="img" aria-labelledby="title desc">
  <title id="title">Area of a circle</title>
  <desc id="desc">A shaded circle with a radius labelled r. Its area is A = πr².</desc>
  <circle cx="160" cy="140" r="110" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
  <line x1="160" y1="140" x2="270" y2="140" stroke="#1e40af" stroke-width="3"/>
  <circle cx="160" cy="140" r="4" fill="#1e40af"/>
  <g fill="#172554" font-family="sans-serif" text-anchor="middle">
    <text x="215" y="128" font-size="22" font-style="italic">r</text>
    <text x="160" y="195" font-size="26">A = πr²</text>
  </g>
</svg>
