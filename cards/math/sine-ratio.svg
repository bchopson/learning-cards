<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Sine in a right triangle</title>
  <desc id="desc">A right triangle with angle θ at the lower left. The vertical side opposite θ is labelled opposite, and the sloping side is labelled hypotenuse. Sine of θ is opposite divided by hypotenuse.</desc>
  <polygon points="35,190 275,190 275,40" fill="#dbeafe" stroke="#1e40af" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M275 190 V40" stroke="#c2410c"/>
    <path d="M35 190 L275 40" stroke="#7e22ce"/>
  </g>
  <path d="M257 190 V172 H275" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M65 190 A30 30 0 0 0 60.44 174.1" fill="none" stroke="#1e40af" stroke-width="2"/>
  <g fill="#172554" font-family="sans-serif" font-size="18" text-anchor="middle">
    <text x="78" y="181" font-size="22">θ</text>
    <text x="150" y="105" transform="rotate(-32 150 105)" fill="#7e22ce" font-weight="bold">hypotenuse</text>
    <text x="302" y="115" transform="rotate(-90 302 115)" fill="#c2410c" font-weight="bold">opposite</text>
    <text x="155" y="218">adjacent</text>
  </g>
</svg>
